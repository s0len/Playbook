name: Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install the package with dev and GUI extras
        run: pip install -e '.[dev,gui]'

      - name: Run pytest
        run: pytest -q
