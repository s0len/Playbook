name: Build and Push Docker Image to GitHub Packages

on:
  push:
    branches:
      - develop
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Read-only by default: the test and scan jobs run third-party code (pip installs),
# so only the jobs that need write access get it.
permissions:
  contents: read

jobs:
  # A push to develop auto-deploys via Renovate digest bumps, so the suite has to gate
  # the image build - not just run alongside it on pull requests.
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install the package with dev and GUI extras
        run: pip install -e '.[dev,gui]'

      - name: Run pytest
        run: pytest -q

  # Security scan must pass before building and pushing
  python-dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Scan requirements.txt for vulnerabilities
        run: pip-audit -r requirements.txt --desc

      - name: Scan requirements-dev.txt for vulnerabilities
        run: pip-audit -r requirements-dev.txt --desc

      # requirements.lock is what the Docker image installs, so it is the file
      # that must be clean before an image is pushed.
      - name: Scan requirements.lock for vulnerabilities
        run: pip-audit -r requirements.lock --desc

  # Note: Docker image scan reports vulnerabilities for visibility but does not
  # block builds. Base image vulnerabilities (Debian trixie) are third-party
  # issues outside our control. Python dependency vulnerabilities are caught by
  # pip-audit in python-dependency-scan which DOES block on issues.
  #
  # See .trivyignore.yaml for documented CVE exceptions.
  docker-image-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image for scanning
        run: docker build -t playbook:scan .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'playbook:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          # Report only mode: base image CVEs are third-party issues
          # Python deps are validated by pip-audit which DOES block
          exit-code: '0'
          trivyignores: '.trivyignore'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy scanner for detailed output
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: always()
        with:
          image-ref: 'playbook:scan'
          format: 'table'
          severity: 'HIGH,CRITICAL'

  build-and-push:
    needs: [pytest, python-dependency-scan, docker-image-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Extract version for tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Set Git info for build
        run: |
          echo "GIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "GIT_BRANCH=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            GIT_SHA=${{ env.GIT_SHA }}
            GIT_BRANCH=${{ env.GIT_BRANCH }}
            BUILD_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && env.VERSION || '' }}
          tags: |
            ${{ github.ref == 'refs/heads/develop' && 'ghcr.io/s0len/playbook:develop' || '' }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/s0len/playbook:{0}', env.VERSION) || '' }}
            ${{ startsWith(github.ref, 'refs/tags/v') && 'ghcr.io/s0len/playbook:latest' || '' }}

      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          {
            awk -v ver="${VERSION}" '
              $0 ~ "^## \\["ver"\\]" { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md
            echo
            echo "## Docker"
            echo '```'
            echo "docker pull ghcr.io/s0len/playbook:${VERSION}"
            echo '```'
            echo "Image published for \`linux/amd64\` and \`linux/arm64\`."
          } > /tmp/release-notes.md
          echo "--- Generated release notes ---"
          cat /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}